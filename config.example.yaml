# Partner Portal — reference configuration.
#
# Every field the binary understands is present below, commented with its type,
# its default, and what it does. Copy this file to `config.yaml` and edit it:
#
#   cp config.example.yaml config.yaml
#   PARTNER_PORTAL_CONFIG=config.yaml ./target/release/partner-portal
#
# The path is taken from `PARTNER_PORTAL_CONFIG`, falling back to `config.yaml`
# in the working directory (src/main.rs).
#
# The listen address is not in this file. It comes from `PARTNER_PORTAL_LISTEN`
# (src/config/listen.rs), defaulting to "0.0.0.0:8080": a port is a property of
# the *deployment* — it has to match the container's port mapping, the
# health-check URL and whatever fronts the process, none of which read this
# YAML — so it is set where the deployment is described, not in a file those
# other halves cannot see. An invalid value is a startup abort that names the
# variable and the value it rejected.
#
# The file is re-read once per second. A change that parses and validates is
# swapped in atomically; a change that does not is logged and the previous
# configuration stays in force (src/config/hot_reload.rs). An unknown key is a
# parse error rather than something to ignore, so a typo is refused instead of
# being silently replaced by the default.
#
# A reload is not uniform, and the watcher says which is which on every change.
# Fields marked "Live" below are read per request from the new snapshot. Every
# other field was captured when the process started — the router, the upstream
# connector, the SSE poller and the ledger writer are each built once — so
# changing one of those logs a warning saying explicitly that the new value is
# NOT in force until restart.
#
# No credentials are logged: the reloader reports *that* a credential changed
# and which field it was, never the value (src/config/hot_reload.rs::report_changes).
# The two this file holds are `upstream.api_key` and `manager.password`;
# partner API keys are not here at all (see the block below), and neither is the
# SMTP credential, which comes from `PARTNER_PORTAL_SMTP_USERNAME` and
# `PARTNER_PORTAL_SMTP_PASSWORD` in the environment and is read as a pair
# (src/config/smtp.rs).

# ---------------------------------------------------------------------------
# server — HTTP listener behaviour.
#
# The listen address itself is NOT here: it is the `PARTNER_PORTAL_LISTEN`
# environment variable (see the header above).
#
# Optional as a block: omit it entirely and every default below applies.
# ---------------------------------------------------------------------------
server:
  # Wait for already-accepted requests to finish on SIGTERM/SIGINT.
  #
  # This controls only the listener. Draining the metering pipeline is *not*
  # optional and happens either way — no setting lets a shutdown drop
  # accepted-but-unwritten usage (src/main.rs, drain sequence).
  # Read once, when the signal handler is installed. Restart required to change.
  # Default: true.
  graceful_shutdown: true

  # How long readiness keeps failing before the listener stops accepting.
  #
  # An instance sets `shutting_down` first, waits this long, then closes the
  # listener. A load balancer polls readiness on an interval, so closing the
  # listener at the same instant readiness flips produces connection errors at
  # the balancer. Too short is a visible error, so err generous.
  # Read once, when the signal handler is installed. Restart required to change.
  # Default: 5.
  shutdown_grace_secs: 5

  # Maximum request body size in bytes, enforced by RequestBodyLimitLayer.
  # Inference requests are small JSON documents; the response, where the size
  # actually is, is streamed and never buffered against this limit.
  # Partly live: the per-request read follows the snapshot, so a *smaller* limit
  # takes effect on reload, but the layer that rejects an oversized body at the
  # edge is built at startup — raising this value needs a restart.
  # Default: 10485760 (10 MiB).
  max_body_size: 10485760

  # Browser origins allowed to call this server, as an explicit allow-list.
  #
  # Empty (the default) means no CORS headers at all, which is correct for the
  # intended deployment: server-side clients and the dashboard's own same-origin
  # UI need none. A wildcard would let any page on the internet spend the
  # upstream credential this proxy holds, so there is deliberately no "*"
  # short-hand. An entry that fails to parse as a header value is logged and
  # skipped. Restart required to change.
  # Default: [] (nothing allowed).
  cors_allow_origins: []
  # cors_allow_origins:
  #   - "https://partners.example.com"

  # How often the dashboard's SSE poller reads `PRAGMA data_version` to detect
  # writes from another connection or another process. Values below 1 are
  # clamped to 1 (a zero interval would spin).
  # Passed to the poller when it is constructed. Restart required to change.
  # Default: 500.
  sse_poll_interval_ms: 500

  # How often the in-memory API-key snapshot is reloaded from the database.
  #
  # Authentication reads a `HashMap` and never queries SQLite, so this is not
  # on the request path — it bounds how long a change made by *another* instance
  # (a create, a revoke, a rotation, or a stored `expires_at` arriving) takes to
  # become effective here. A change made through this instance's own admin API
  # refreshes the snapshot synchronously and does not wait for this interval.
  #
  # It also bounds expiry: a key past its `expires_at` stops authenticating
  # within one interval of that instant, because the reload is unconditional
  # rather than gated on the database changing (an expiry writes nothing
  # anywhere). Values below 1 are clamped to 1.
  # Read when the refresher task is spawned. Restart required to change.
  # Default: 1000.
  api_key_refresh_ms: 1000

# ---------------------------------------------------------------------------
# upstream — the single OpenAI-compatible API this proxy forwards to.
#
# Required, and singular by design: one base URL, one credential. There is no
# routing, no failover, no request transformation (docs/adr/0001).
# ---------------------------------------------------------------------------
upstream:
  # Base URL, `http://` or `https://` with a host. A trailing slash is trimmed
  # before the request path is appended, so "https://api.openai.com/" and
  # "https://api.openai.com" both produce ".../v1/chat/completions".
  # A base *path* is preserved: "https://gw.internal/openai/v1" + "/v1/responses"
  # becomes "https://gw.internal/openai/v1/v1/responses" — this proxy does not
  # rewrite paths, it appends them.
  #
  # Parsed at load: a URL with no host ("http://"), no scheme ("not-a-url"), or
  # a scheme other than http/https is a startup failure, because it cannot serve
  # a request and would otherwise surface as a 502 per request.
  # Live: read per request, so a reload repoints the upstream immediately.
  base_url: "https://api.openai.com"

  # Credential sent upstream as `Authorization: Bearer <api_key>`.
  #
  # The client's own Authorization header is removed before this is set; the
  # local key never reaches the upstream. Read per request, so rotating it via
  # hot reload takes effect on the next request.
  api_key: "sk-replace-me"

  # Timeout in seconds for the whole upstream exchange. Applied twice, because
  # the two failure modes differ: as a cap on time-to-response-headers, and as
  # an *idle* timeout between frames mid-stream. An upstream that goes silent
  # mid-stream is failed rather than held open indefinitely.
  # Values below 1 are clamped to 1.
  # Live: read per request.
  # Default: 120.
  timeout_secs: 120

  # TCP connect timeout in seconds, and the only upstream setting fixed at
  # startup: it configures the connector and its connection pool. Values below 1
  # are clamped to 1. Happy Eyeballs is enabled with a 300 ms delay so a DNS
  # name with a blackholed first address does not stall for the full timeout.
  # Restart required to change.
  # Default: 10.
  connect_timeout_secs: 10

# ---------------------------------------------------------------------------
# Partner API keys are NOT in this file.
#
# They are rows in the `api_keys` table of the database named under `database`
# below, and that is the only place they live (docs/adr/0014). This file is
# deployment and runtime behaviour; a credential is neither.
#
# There is no `keys:` block here on purpose. `Config` rejects unknown fields, so
# a configuration carrying one is a **startup parse error** naming the field —
# an operator who upgrades and keeps the old file is told by the process rather
# than discovering it as a 401 on the first request.
#
# What a key row holds, and where each piece is enforced:
#
#   * `name`            a human-readable label, and the identity a key falls
#                       back to when `consumer_id` is empty.
#   * `consumer_id`     the identity written to the ledger and the isolation
#                       boundary for every dashboard query. Always derived
#                       server-side from the row the credential matched — never
#                       from a request header, body field or query parameter
#                       (src/auth/middleware.rs, docs/adr/0008).
#   * `key_prefix`      the first 12 characters of the plaintext, for telling
#                       two keys apart in a list. Not a secret.
#   * `key_hash`        `hex(HMAC-SHA256(secret, plaintext))`. The plaintext is
#                       never stored, never logged, and never returned by any
#                       read endpoint.
#   * `status`          `active` or `revoked`. A key past `expires_at` is
#                       filtered out at load and is never authenticated.
#
# A key carries no model list of its own. Which models a partner may call — and
# what each of them costs — is the `partner_models` table, configured per partner
# through `PUT /api/admin/partners/{consumer_id}/models` or `keygen` below. One
# map answers both questions, so a model a partner can call is always a model with
# a price, and a model with no entry is refused `404 model_not_found` before the
# upstream is contacted and before a metering row is written; `/v1/models`
# answers the same filtered list (docs/adr/0012 as amended by docs/adr/0015).
#
# A partner has **at most one active key**, enforced by a partial unique index
# rather than by a check — a check-then-insert is a race between two instances,
# and the thing that must never happen is a partner holding two live credentials.
# To replace a key, rotate it: one transaction issues the new plaintext and
# revokes the old one.
#
# Two keys that share a `consumer_id` deliberately share one usage view — the
# rotation pattern. Granting that share is an explicit operator decision; no
# request can assert it. Two partners can never observe each other's data
# (tests/e2e/dashboard_isolation.rs).
#
# # Issuing the first key
#
# A fresh database has zero keys, and the only way to create one is the admin
# API — which is authenticated with the `manager` password below. To bootstrap
# a deployment, either call the API with that password:
#
#   curl -sS -X POST http://127.0.0.1:8080/api/admin/partners \
#     -H "Authorization: Bearer $MANAGER_PASSWORD" \
#     -H 'content-type: application/json' \
#     -d '{"consumer_id":"acme","name":"Acme","billing_mode":"invoice",
#          "billing_email":"billing@acme.test"}'
#
# — then price the partner's models, and only then issue the key:
#
#   curl -sS -X PUT http://127.0.0.1:8080/api/admin/partners/acme/models \
#     -H "Authorization: Bearer $MANAGER_PASSWORD" \
#     -H 'content-type: application/json' \
#     -d '{"models":[{"model":"gpt-4o","input_per_million":"0.095",
#          "cached_input_per_million":"0.0475","output_per_million":"0.475"}]}'
#
#   curl -sS -X POST http://127.0.0.1:8080/api/admin/api-keys \
#     -H "Authorization: Bearer $MANAGER_PASSWORD" \
#     -H 'content-type: application/json' \
#     -d '{"name":"acme-production","consumer_id":"acme"}'
#
# — which prints the plaintext key exactly once — or run the one-shot helper
# against the same database file, which needs no running instance and creates the
# partner row, its prices and the key in one transaction:
#
#   ./partner-portal keygen --database ./partner-portal.db \
#     --name acme-production --consumer-id acme \
#     --billing-mode invoice --billing-email billing@acme.test \
#     --model gpt-4o:0.095:0.0475:0.475 --model gpt-4o-mini:0.002375:0:0
#
# The plaintext exists in that one response and nowhere else. Losing it is not
# recoverable by design: rotate the row, which issues a new plaintext and
# revokes the old one in a single transaction.
#
# The HMAC secret that keys every hash comes from the required environment
# variable `PARTNER_PORTAL_API_KEY_SECRET` (at least 32 bytes), never from
# this file and never from the database — see the header above.

# ---------------------------------------------------------------------------
# manager — optional operator credential with a cross-consumer dashboard view.
#
# This is the one deliberate widening of the otherwise strictly consumer-scoped
# dashboard (docs/adr/0008, docs/adr/0013). When the block is present, the
# dashboard login accepts this password — sent as
# `Authorization: Bearer <password>`, exactly like a key value — and the
# resulting session sees the usage of EVERY consumer. There is no allow-list to
# configure: a list of what may be seen would live in the same file as the data
# it guards, which is why it was removed. The dashboard's consumer selector
# offers the consumers actually present in the ledger; picking one narrows the
# view, and that filter never widens anything.
#
# The comparison is exact string equality, so a password *is* a plaintext secret
# in a file: rotate it via hot reload, and it is scrubbed from ledger text and
# redacted in logs just like the upstream key (src/config/types.rs::credentials).
#
# Live: read per request from the snapshot, so a rotation takes effect on the
# next request.
# ---------------------------------------------------------------------------
manager:
  # The password a manager presents at the dashboard login. Required when the
  # block is present: `manager: {}` is refused at load, because an empty
  # password would parse and silently do nothing while reading as though it
  # granted access.
  password: "pp-manager-password-replace-me"

# ---------------------------------------------------------------------------
# billing — daily postpaid statements, and how they reach the partner.
#
# Optional as a block: omit it and every default below applies, which means
# statements are closed on UTC days five minutes after they end and nothing is
# emailed.
#
# What this block does NOT configure is what anything costs, who owes anything,
# or where a statement goes. Those are per partner and live in the `partners` and
# `partner_models` tables, edited through the admin API — a price is a commercial
# fact about a customer, not a property of the deployment, and one file cannot
# hold both without the file becoming the customer database
# (docs/adr/0015).
#
# There are no SMTP credentials here either. They come from
# `PARTNER_PORTAL_SMTP_USERNAME` and `PARTNER_PORTAL_SMTP_PASSWORD` in the
# environment, read as a pair (src/config/smtp.rs): neither is an anonymous
# relay, and exactly one is a warning and a skipped send rather than a startup
# failure. A password in this file is a password in a file that gets committed,
# and this file is re-read every second.
# ---------------------------------------------------------------------------
billing:
  # The billing calendar's distance from UTC, in minutes. Range: -720 (UTC-12)
  # to 840 (UTC+14), the whole set of real civil offsets; anything else is
  # refused at load rather than silently falling back to UTC.
  #
  # A statement is "for 2026-09-27" in *this* calendar, so a partner reading it
  # means their own 27th. Stored timestamps stay UTC; the offset is applied when
  # a day is named and when a cutoff is computed, and nowhere else. Every
  # statement row carries its own period bounds in UTC, so an old statement does
  # not depend on this still being what it was.
  #
  # A fixed offset rather than a zone name on purpose: a zone name means a tz
  # database, and a tz database update would move a statement by an hour. A
  # deployment that wants daylight saving moves this value deliberately, at a
  # boundary it chooses. Half-hour and 45-minute offsets work (330 is UTC+05:30).
  # Live: read when the scheduler builds a generator. Restart required to change.
  # Default: 0 (UTC).
  timezone_offset_minutes: 0

  # How long after a billing day ends it may be closed.
  #
  # A request accepted at 23:59:59 is metered *before* the upstream is contacted
  # and finalised after it, so closing the day at the instant it ends would drop
  # the last requests of the day — a systematic under-bill at exactly the
  # boundary a customer can see. This is the window in which those rows land.
  # Zero is valid and means "close it as soon as it ends"; negative is refused.
  # Live: read when the scheduler builds a generator. Restart required to change.
  # Default: 5.
  close_delay_minutes: 5

  # How often the scheduler looks for days to close, in seconds. Values below 1
  # are clamped to 1.
  #
  # This is not the deadline — `close_delay_minutes` decides *when* a day may
  # close, and this decides how promptly the process notices. The work is
  # idempotent and a closed day is never reopened (`UNIQUE(consumer_id,
  # billing_date)`), so a second instance running the same sweep is a no-op
  # rather than a double bill.
  # Read when the worker task is spawned. Restart required to change.
  # Default: 30.
  scheduler_interval_secs: 30

  # -------------------------------------------------------------------------
  # billing.email — whether a statement is also sent to the partner.
  #
  # Email is at-least-once and best-effort, and it is a *courtesy on top of the
  # statement*, never the statement itself. Delivery state is bookkept on the
  # statement row (`email_sent_at`, `email_attempts`, `email_last_error`,
  # `email_next_retry_at`) and a failed send is retried with backoff — it never
  # changes the amount owed and never blocks the statement from being issued.
  #
  # Nothing in a message is secret: a statement carries the partner's own model
  # names, tokens and amounts. It carries no API key, no upstream credential and
  # no request body, and the send is only attempted once the statement is already
  # durable.
  # -------------------------------------------------------------------------
  email:
    # Whether statements are emailed at all.
    #
    # Off by default. A deployment that has not configured a relay must not
    # discover it by having statements bounce, and a staging instance pointed at
    # production's database wants the statements without the mail. When this is
    # true, `smtp_host` and `from_address` must both be set or the file is
    # refused at load — an operator asking for email and getting silence is the
    # failure this catches.
    # Read when the worker task is spawned. Restart required to change.
    # Default: false.
    enabled: false

    # The relay to hand the message to. A hostname or IP; STARTTLS is negotiated
    # on the submission port below.
    # The conversation is always plaintext-then-STARTTLS: if the relay advertises
    # STARTTLS the session is upgraded, and if it does not, a configured
    # credential is withheld and the send fails rather than going out in the
    # clear. There is no implicit-TLS path, so a relay that expects TLS from the
    # first byte (the usual 465) will not complete the greeting.
    # Live: read per send, so a reload repoints the relay immediately.
    # Default: "" (nothing to send through).
    smtp_host: ""

    # The relay's submission port. 587 is the standard submission port; 25 is for
    # relay-to-relay traffic and is blocked by most networks. 1025 is what the
    # dev fixture listens on.
    # Live: read per send.
    # Default: 587.
    smtp_port: 587

    # The envelope and header `From`. Not defaulted anywhere on purpose: a
    # statement sent from an address nobody owns looks delivered, which is worse
    # than one that visibly failed. A reply to it should reach a person.
    # Live: read per send.
    # Default: "" (refused when `enabled` is true).
    from_address: ""

# ---------------------------------------------------------------------------
# database — the durable usage ledger.
#
# Optional as a block. The database is opened, its schema created, and crash
# recovery run before the listener binds; a failure in any of those is a startup
# failure, not a degraded mode (src/main.rs).
# ---------------------------------------------------------------------------
database:
  # Path to the SQLite file. The directory must exist and be writable. `-wal`
  # and `-shm` sidecar files appear alongside it. Place it on local disk: WAL
  # mode requires shared memory, so a network filesystem is not supported.
  # Opened once at startup. Restart required to change.
  # Default: "partner-portal.db".
  path: "./partner-portal.db"

  # How long usage is kept. A sweep every `retention_interval_secs` deletes raw
  # rows with `created_at` strictly older than this many days, and the rollups
  # whose hour bucket is older than the same cutoff. Values below 1 are clamped
  # to 1, so `0` cannot wipe the ledger (src/ledger/retention.rs::cutoff_for).
  # Partly live: the dashboard validates a query window against the new value,
  # but the sweep runs on the value read at startup. Restart to change the sweep.
  # Default: 60.
  retention_days: 60

  # Capacity of the metering queue, in records. Minimum 1: a zero-capacity queue
  # cannot be built at all, so it is refused when the file is loaded.
  #
  # This bounds memory. When it is full, producers *wait* rather than dropping —
  # backpressure, never loss — and readiness fails once more than half of it is
  # outstanding, so a load balancer stops sending before requests start to queue
  # (src/ledger/writer.rs). Raising it absorbs longer database stalls at the
  # cost of memory and a longer drain at shutdown.
  # Passed to the writer when it is constructed. Restart required to change.
  # Default: 10000.
  queue_size: 10000

  # Records pulled per commit. A batch is one transaction, so this trades commit
  # latency against throughput. The writer holds at most this many records
  # outside the channel. Minimum 1: the writer only pulls while its batch is
  # below this size, so `0` never takes a record off the queue — the process
  # would look healthy and meter nothing. Refused at load.
  # Passed to the writer when it is constructed. Restart required to change.
  # Default: 100.
  batch_size: 100

  # How long the writer waits to fill a batch before committing what it has.
  # A closed channel (shutdown) flushes immediately rather than waiting this
  # out. `0` is accepted and means "commit as soon as anything is queued".
  # Passed to the writer when it is constructed. Restart required to change.
  # Default: 1000.
  batch_timeout_ms: 1000

  # How often the retention sweep runs. Values below 60 are clamped to 60.
  # Read when the sweep task is spawned. Restart required to change.
  # Default: 3600.
  retention_interval_secs: 3600

  # Rows deleted per retention slice.
  #
  # Retention is sliced so the write lock is released between slices; a single
  # DELETE over 60 days of records would hold it for the whole sweep and stall
  # metering. Each slice commits on its own, so a crash mid-sweep leaves the
  # database consistent and the next sweep continues. Values below 1 are
  # clamped to 1.
  # Read when the sweep task is spawned. Restart required to change.
  # Default: 2000.
  retention_batch_size: 2000
