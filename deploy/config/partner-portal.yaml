# Configuration for the two-instance deploy stack (deploy/docker-compose.yml).
#
# Both instances mount this one file: they are the same process shape, differing
# only in the port the edge publishes them on. Nothing here may be per-instance
# — in particular `database.path` must resolve to the same file for both, because
# that single ledger is what makes the pair one logical service rather than two
# competing ones.
#
# The full field reference, with defaults and rationale, is config.example.yaml
# at the repository root; this file lists what the deployment actually sets.

server:
  # No listen address here: the image sets `PARTNER_PORTAL_LISTEN=0.0.0.0:8080`
  # (the Dockerfile), which is the right value inside a container's own network
  # namespace. The host-facing ports are the compose `ports:` entries.

  # The edge stops routing to an instance before it stops accepting, so the
  # listener must wait for requests it already accepted. Readiness flips at the
  # start of this window; the balancer needs at least one poll interval to
  # notice, which is what this covers.
  graceful_shutdown: true
  shutdown_grace_secs: 5

  # No browser origin may call this proxy directly: the dashboard is served from
  # the same origin as the API, and every other caller is server-side. An
  # allow-list is deliberate — this proxy spends an upstream credential.
  cors_allow_origins: []

upstream:
  # Replace with the real OpenAI-compatible endpoint. The smoke configuration
  # (partner-portal.smoke.yaml) points this at the bundled mock instead.
  base_url: "https://api.openai.com"
  # A placeholder, not a secret. The real key is injected per deployment; this
  # file is committed, so it must never hold one.
  api_key: "REPLACE-WITH-UPSTREAM-KEY"
  timeout_secs: 120
  connect_timeout_secs: 10

# There is no `keys:` block here, and there cannot be one: partner API keys are
# rows in the ledger database (docs/adr/0014), and `Config` rejects an unknown
# field, so a leftover block is a start-up failure rather than a credential
# source nobody is reading. Provision the first key with
#
#   docker compose exec portal-a partner-portal keygen \
#     --name partner-production --consumer-id acme \
#     --billing-mode invoice --billing-email billing@acme.example \
#     --model gpt-4o:2.5:1.25:10
#
# which prints the plaintext once and stores only its keyed hash, and issues that
# partner's commercial record with it: the mode is how the partner is billed
# (ADR 0015) and each `--model` is one model they may call *and* its price in
# dollars per million tokens — input, cached input, output. A model with no price
# is a model the partner cannot call, so the two are one flag rather than two
# lists that could disagree. Issue, rename, restrict, rotate and revoke the
# remaining keys through `POST /api/admin/api-keys`, and change a partner's
# models, prices or terms through `PUT`/`PATCH /api/admin/partners/:id`, with the
# manager password. All of it writes to `database.path` below, which is why that
# file must be on a volume: a key issued into a container's own filesystem
# disappears with the container.
#
# The secret those hashes are keyed with is neither in this file nor in the
# database: `PARTNER_PORTAL_API_KEY_SECRET`, at least 32 bytes, supplied through
# the environment (`docker-compose.yml` passes the host's through and refuses to
# start without it). The process will not start without it either — and because
# a stored hash can only be verified under the secret it was written with, the
# value must not change between restarts. See docs/adr/0014.

manager:
  # The credential that reaches `/api/admin/api-keys` — and the dashboard's
  # cross-consumer view. Replace it. The manager password is read from this file
  # only, so a deployment that must keep it out of the repository replaces it in
  # its own copy of this directory rather than looking for a variable: there is
  # no environment override for it.
  password: "REPLACE-WITH-A-MANAGER-PASSWORD"

# Billing (docs/adr/0015). Every field here has a documented default — the full
# reference is config.example.yaml — and what this block states is the handful
# this deployment would rather decide than inherit.
#
# It is NOT per-instance: both instances close days from the same ledger, and
# the schedule they agree on is what makes two runs one statement
# (`UNIQUE(consumer_id, billing_date)`). A `timezone_offset_minutes` that
# differed between the containers would put the same request in two days.
billing:
  # UTC. Statements are labelled with the partner's calendar, and a deployment
  # that bills partners in one region states that region's offset here. A fixed
  # offset, not a zone name: a tz database update must not move a closed day.
  timezone_offset_minutes: 0

  # A day is closed this long after it ends, so a request accepted at 23:59:59
  # — which is metered before the upstream is contacted and finalised after —
  # still lands inside the day it belongs to. Lowering this to 0 is valid and
  # systematically under-bills the last seconds of every day.
  close_delay_minutes: 5

  # How often the worker looks for a closable day. It is a poll, not a deadline.
  scheduler_interval_secs: 30

  # Email is off until a relay is named. Turning it on without `smtp_host` and
  # `from_address` is refused when this file loads, because "asked for email,
  # got silence" is the failure that would otherwise go unnoticed. The
  # credentials — PARTNER_PORTAL_SMTP_USERNAME and PARTNER_PORTAL_SMTP_PASSWORD
  # — are environment variables, never fields here: this file is committed.
  #
  # Statements are issued whether or not this is true. Email is a courtesy on
  # top of the statement, and a relay that is down delays a message, not a bill.
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    from_address: ""

database:
  # Absolute, and on the shared volume: the pair writes to one ledger.
  #
  # WAL is what makes two writer processes safe here — each instance serializes
  # its own writes, and cross-process writes take the WAL write lock with a
  # 5s busy timeout (src/ledger/mod.rs::configure_sqlite). The .db, .db-wal and
  # .db-shm files are one unit: they must live on the same volume and be backed
  # up together.
  path: "/var/lib/partner-portal/partner-portal.db"
  retention_days: 60
  # Sized per instance: this is the in-memory queue before a request is refused
  # with 503, not a shared budget.
  queue_size: 10000
  batch_size: 100
  batch_timeout_ms: 1000
