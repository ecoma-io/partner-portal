# Smoke configuration: identical to partner-portal.yaml except that the upstream
# is the mock bundled with this directory, so the stack can be exercised end to
# end without an upstream credential or an outbound call.
#
# Used by deploy/smoke-test.sh via PARTNER_PORTAL_CONFIG_FILE. It differs from
# the production file in exactly one value, which is the point: the smoke test
# proves the deployment path, not a different deployment.

server:
  graceful_shutdown: true
  shutdown_grace_secs: 5
  cors_allow_origins: []

upstream:
  # The `mock-upstream` service in docker-compose.yml, reachable by name on the
  # compose network while the `smoke` profile is active.
  base_url: "http://mock-upstream:9000"
  api_key: "smoke-upstream-key"
  timeout_secs: 30
  connect_timeout_secs: 5

# There is no `keys:` block here, and there cannot be one (docs/adr/0014): a
# partner key is a row in the ledger database, and `Config` rejects an unknown
# field, so a leftover block is a start-up failure rather than a second
# credential source. deploy/smoke-test.sh seeds `smoke-key-please-replace` with
# `partner-portal keygen` before the stack starts, and rewrites its model list
# through `PATCH /api/admin/api-keys/:id` — the same two operations an operator
# performs on a real deployment, which is why the smoke test performs them.

manager:
  # A fixture, like `smoke-upstream-key` above: the credential the smoke test
  # presents to the admin surface. It is what lets a run widen the key's model
  # list through the API instead of editing this file (docs/adr/0014).
  password: "smoke-manager"

database:
  path: "/var/lib/partner-portal/partner-portal.db"
  retention_days: 60
  queue_size: 10000
  batch_size: 100
  batch_timeout_ms: 1000
