# Which instances the edge routes to.
#
# This file is the traffic switch. rolling-update.sh rewrites it (marking an
# instance `down`, then removing the mark) and reloads nginx — `nginx -s reload`
# is graceful: workers finish in-flight requests against the old configuration
# before exiting, so a switch does not cut a streaming response in half.
#
# `resolve` plus the resolver in nginx.conf means a recreated container is picked
# up by name at its new address. `max_fails`/`fail_timeout` are passive checks:
# an instance that starts refusing connections is taken out of rotation by nginx
# itself, which is the safety net under the explicit switch.
#
# An instance is marked `down` — not deleted — while it is being replaced. Its
# line (and its comment) stays as the record of which slot is which; deleting it
# would make the next update guess.

upstream portal {
    zone portal 64k;
    least_conn;

    server portal-a:8080 resolve max_fails=2 fail_timeout=5s;
    server portal-b:8080 resolve max_fails=2 fail_timeout=5s;

    keepalive 16;
}
