# The edge in front of the two portal instances.
#
# Its job is narrow on purpose: hold the two instances as one upstream, and make
# "take this instance out of rotation" a one-line file edit plus a reload. That
# is what turns the rolling update in rolling-update.sh into a real traffic
# switch rather than a hope.
#
# It is not a load balancer with opinions: no retries against the upstream, no
# caching, no buffering. This proxy's responses are SSE streams and its requests
# are billed — a retried request is a second request, and a buffered stream is a
# broken one.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Logs to the container's stdout/stderr, where `docker compose logs` finds
    # them. A log file inside the container is a log nobody reads.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Docker's embedded DNS. Without a resolver and `resolve` on the upstream
    # servers, nginx resolves `portal-a`/`portal-b` once at startup and keeps
    # routing to the IP of a container that has since been recreated — which is
    # exactly what a rolling update does.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Re-resolved upstream members are the only thing this file expects to
    # change; keepalive keeps the connection to each instance warm so a switch
    # does not pay a TCP handshake per request.
    #
    # The path is under /etc/portal-edge because deploy/docker-compose.yml mounts
    # the whole ./nginx directory there: that directory mount is what makes an
    # edit to upstream.conf visible to `nginx -s reload` immediately. A file bind
    # mount pins the inode, so an edit that rewrites by rename would leave nginx
    # reloading the old configuration while the operator sees the new one on disk.
    include /etc/portal-edge/upstream.d/upstream.conf;

    server {
        # 8080, not the image's default 80: this is the port the compose file
        # publishes (and the port the instances themselves speak), so the edge
        # addresses the stack the same way a client does and a port number in a
        # log line, a compose file or a firewall rule means one thing here.
        listen 8080;

        # Requests are streamed, not collected: /api/dashboard/events is an SSE
        # endpoint, and a proxy that buffers turns a live dashboard into one that
        # updates in bursts.
        location / {
            proxy_pass http://portal;
            proxy_http_version 1.1;
            # Required for the keepalive above; an empty Connection header lets
            # nginx speak HTTP/1.1 keepalive to the upstream.
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            # Inference requests can legitimately take minutes.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # No `proxy_next_upstream`: a failed or repeated attempt against a
            # metered upstream is a second billed request. An instance that is
            # down should surface as an error at the edge, not as a retry the
            # ledger cannot see.
            proxy_next_upstream off;
        }
    }
}
