name: CI

# Runs on every pull request and on every push to the default branch. A push to
# main is what the release tags are cut from, so it gets the same checks as a PR
# rather than a subset.
on:
  pull_request:
  # The merge queue's candidate ref fires merge_group, not pull_request —
  # without this trigger the queue's required checks never start on the
  # candidate and the entry sits in AWAITING_CHECKS forever.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

# One run per ref. A force-push to a pull request supersedes the run it
# replaced: the older run's result describes a commit nobody is looking at any
# more, and leaving it alive only competes for runners with the run that
# matters. Pushes to main and merge-queue candidates are grouped per commit and
# never cancelled — a cancelled main run is a hole in the record a release is
# cut from.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default. `permissions:` is set per job where a job needs more, so
# a compromised dependency in one step cannot inherit write access to the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Trimmed backtraces: enough to locate a panic, not enough to fill a log page.
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # The Rust workspace: formatting, lint, and the unit tests.
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (fmt, check, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          # Pinned refs carry no branch name, so the toolchain must be given
          # here rather than left to the ref (`@stable`) — without it the
          # action fails with "'toolchain' is a required input".
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust

      # Formatting is checked, never applied: a formatter that rewrites the
      # working tree in CI turns "did you run fmt" into a silent commit.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --locked --all-targets

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # No service matrix is needed here, and that is a property of the design
      # rather than an omission: the ledger is embedded SQLite (no database
      # container) and the upstream is stubbed per test over a real socket (no
      # upstream container). This runs every target, including the spawned-binary
      # suites; the next job runs those same suites against the *release* build
      # and the dashboard the frontend job just produced, which is what ships.
      #
      # The e2e suite runs under its serial contract (--test-threads=1): its
      # cases own OS-level state — ports, signals, a rolling update — and a
      # parallel run is a race the suite was never written to win. The other
      # suites have no such contract and run at full width.
      - name: cargo test (lib, integration, fault)
        run: cargo test --locked --all-features --lib --test integration --test fault

      - name: cargo test (e2e, serial)
        run: cargo test --locked --all-features --test e2e -- --test-threads=1

  # ---------------------------------------------------------------------------
  # The dashboard. Lint and typecheck are separate steps from the build so a
  # failure says which one it was.
  # ---------------------------------------------------------------------------
  frontend:
    name: Dashboard (lint, typecheck, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version is pinned here as well as in the Dockerfile: the image and CI
      # must resolve the same dependency graph from the same lockfile.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      # --frozen-lockfile is the whole point of committing the lockfile; without
      # it a CI pass would not prove the tag installs.
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      - name: pnpm lint
        run: pnpm lint

      - name: pnpm typecheck
        run: pnpm typecheck

      - name: pnpm build
        run: pnpm build

      # Handed to the integration job so the binary it builds is the artifact
      # that ships — dashboard embedded — rather than a placeholder-page build.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-dist
          path: dashboard/dist
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The suites that drive the real binary as a child process.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration and fault suites
    needs: [frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: integration

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dashboard-dist
          path: dashboard/dist

      # The suites spawn this binary, so it is built before they run — and built
      # in release, because that is the profile the deploy artifacts use and the
      # one whose timing behaviour the drain assertions were written against.
      - name: Build the binary the suites drive
        run: cargo build --locked --release --bin partner-portal

      - name: Run the integration and fault suites
        env:
          # Convenience for a suite that wants the path explicitly; cargo also
          # exports CARGO_BIN_EXE_partner-portal to integration tests.
          PARTNER_PORTAL_BIN: ${{ github.workspace }}/target/release/partner-portal
        run: |
          set -euo pipefail
          # A suite is a directory with a main.rs — cargo's rule for an
          # integration-test target, which lets a suite keep its cases in
          # separate files under tests/<name>/. The e2e suite is excluded here:
          # it has its own step, below, and its own contract.
          suites=()
          while IFS= read -r dir; do
            suite="$(basename "$dir")"
            if [ "$suite" = "e2e" ]; then continue; fi
            suites+=("$suite")
          done < <(find tests -mindepth 2 -maxdepth 2 -name main.rs -printf '%h\n' 2>/dev/null | sort)

          if [ "${#suites[@]}" -eq 0 ]; then
            echo "::notice::no test suites under tests/<name>/main.rs; nothing to run"
            exit 0
          fi

          args=()
          for suite in "${suites[@]}"; do
            args+=("--test" "$suite")
          done

          echo "running suites: ${suites[*]}"
          cargo test --locked --release "${args[@]}"

      # The e2e suite's cases share OS-level state — signals, a rolling update,
      # crash recovery — and the suite's contract is one test at a time
      # (AGENTS.md, CONTRIBUTING.md). Parallel here is not faster, it is a
      # different, racy test.
      - name: Run the end-to-end suite (serial by contract)
        run: cargo test --locked --release --test e2e -- --test-threads=1

  # ---------------------------------------------------------------------------
  # The image, built and then run.
  # ---------------------------------------------------------------------------
  container:
    name: Container (build and smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The build metadata `GET /version` reports. Computed here rather than read
      # from `github.run_started_at`, which actionlint's context data does not
      # carry — a workflow that lints clean is a workflow whose next error is
      # believed.
      - name: Build metadata
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_ENV"

      - name: docker build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: partner-portal:ci
          # CACHEBUST (Dockerfile) busts the apt layer per run so the image's
          # package patch level stays current; the security job's rebuild
          # must receive the same value or it re-keys the layer.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}
            VERSION=0.0.0-ci
            CACHEBUST=${{ github.run_id }}
          # The build is a full release compile of the dependency tree; without
          # the layer cache every PR pays for it from scratch.
          cache-from: type=gha,scope=partner-portal-image
          cache-to: type=gha,mode=max,scope=partner-portal-image

      # The same script an operator can run against a tag before promoting it:
      # the image's runtime contract, liveness, readiness, auth, an end-to-end
      # proxied request, the model gate's refusal, the embedded dashboard, and
      # the SIGTERM drain.
      - name: Image smoke test
        run: ./scripts/docker-smoke-test.sh partner-portal:ci

      # The deployment shape, not only the built image — two instances of this
      # build over one SQLite ledger, behind the edge. It asserts what the pair exists
      # for — every request reaches the upstream once and lands in the ledger
      # once — and that taking a slot out of rotation moves the traffic rather
      # than dropping it. Ports are passed explicitly so the job cannot collide
      # with anything the runner already listens on.
      - name: Deployment smoke test (two instances, one ledger)
        env:
          PARTNER_PORTAL_IMAGE: partner-portal:ci
          EDGE_PORT: "18080"
          PORTAL_A_PORT: "18081"
          PORTAL_B_PORT: "18082"
        run: ./deploy/smoke-test.sh

      - name: Container logs on failure
        if: failure()
        run: docker ps -a --format '{{.Names}}' | grep partner-portal | xargs -r -n1 docker logs || true

  # ---------------------------------------------------------------------------
  # Supply chain: what is in the build, and what is in the image.
  # ---------------------------------------------------------------------------
  security:
    name: Security (deny, audit, secrets, SBOM, image scan)
    needs: [container]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads history, not just the working tree: the secret that
          # matters is usually the one that was committed and then removed.
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust

      # ---------------------------------------------------------------------
      # Licences, bans, sources and advisories for the Rust dependency graph.
      # ---------------------------------------------------------------------
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          # A vulnerability or a licence violation fails the job; an
          # unmaintained-but-not-vulnerable advisory is reported and does not,
          # which is the split deny.toml encodes.
          log-level: warn

      # ---------------------------------------------------------------------
      # The RustSec advisory database, independently of deny.toml's policy.
      # ---------------------------------------------------------------------
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          # Pinned to a version, not left at whatever `latest` resolves to
          # today: a scanner that moves between two runs of the same commit
          # makes green mean nothing. Renovate bumps the pins.
          tool: cargo-audit@0.22.2

      - name: cargo-audit
        # RUSTSEC-2026-0009 (`time` < 0.3.47) is ignored with a written
        # reachability argument in deny.toml; cargo-audit does not read that
        # file's policy, so the same verdict is carried here by flag. The two
        # entries change together — see deny.toml before touching either.
        run: cargo audit --deny warnings --ignore RUSTSEC-2026-0009

      # ---------------------------------------------------------------------
      # Secrets in the tree and in history.
      # ---------------------------------------------------------------------
      # The binary is downloaded directly rather than installed through
      # taiki-e/install-action: gitleaks is no longer in that action's
      # manifest (both the floating @v2 and the pinned v2.87.20 answer
      # "install-action does not support gitleaks", and the cargo-binstall
      # fallback finds no crate of that name) — the reason every other
      # repository in the organisation drives the binary directly. Version
      # pinned and verified against the checksum the release publishes;
      # Renovate bumps the version in the URL, and the checksum moves in the
      # same pull request by hand — the sha256sum gate below makes a
      # version-only bump fail loudly instead of passing with a stale digest.
      - name: Install gitleaks 8.24.3
        run: |
          curl --fail --silent --show-error --location \
            --retry 10 --retry-all-errors --retry-delay 15 \
            "https://github.com/zricethezav/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check --strict -
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks

      - name: gitleaks
        # --redact so a real finding is not echoed into a public build log; the
        # report file names the commit and the rule instead.
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: |
          "$GITLEAKS_BIN" detect \
            --source . \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --redact \
            --verbose

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

      # ---------------------------------------------------------------------
      # SBOM of the source tree — the dependency graph a release was built from.
      # ---------------------------------------------------------------------
      - name: SBOM (syft, SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-source.spdx.json
          # Not a release job; the SBOM is evidence for this run, and the
          # release workflow generates the one that ships.
          upload-release-assets: false

      # ---------------------------------------------------------------------
      # The image, scanned. Rebuilt here rather than handed over from the
      # container job (a loaded image does not survive a job boundary); the
      # shared cache scope means this is a cache restore, not a second compile.
      # ---------------------------------------------------------------------
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Rebuild the image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: partner-portal:scan
          # The same run-id bust the container job passes: the apt layer's
          # cache key carries it, and only a matching value restores the layer
          # that build just stored. A default here would re-key the layer and
          # scan a coincidentally-fresher image than the one that ships (#9).
          build-args: |
            CACHEBUST=${{ github.run_id }}
          cache-from: type=gha,scope=partner-portal-image

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: partner-portal:scan
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          # The base image is debian-slim with ca-certificates and curl; ignoring
          # unfixed findings keeps the signal on what can actually be acted on.
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy filesystem scan (config and dependencies)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-sarif
          path: trivy-image.sarif
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The one check a branch ruleset can require while the roster above it
  # evolves: add a job to `needs` and the gate tightens without touching
  # repository settings. `needs` alone would let a skipped or cancelled job
  # pass as green — only `failure` blocks a dependent job by default — and a
  # job-level skip is never legitimate here.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: ci-gate
    needs: [rust, frontend, integration, container, security]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
