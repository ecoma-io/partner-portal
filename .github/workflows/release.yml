name: Release
#
# Cutting a release is: merge the Release PR, and nothing else. The first job
# below maintains that PR from the Conventional Commits since the last release;
# merging it tags the merge commit `vX.Y.Z`, and the jobs after it turn that tag
# into the four things a deployment needs — the binaries, their checksums, the
# SBOM, and an immutable OCI image addressed by digest. The version is derived
# from the commits rather than chosen by hand, so a `fix` is a patch and a
# `feat!` is a major without anyone deciding which.
#
# ---------------------------------------------------------------------------
# Deployment flow (the order is the contract; deploy/README.md has the commands)
# ---------------------------------------------------------------------------
#
#   1. backup                  Online SQLite backup of the shared ledger, before
#                              anything else can touch it. Taken with the
#                              database's own backup API, not `cp`: the ledger is
#                              in WAL mode with a live writer.
#   2. preflight               Image present and pullable, compose config valid,
#                              both instances healthy, free disk, backup written.
#                              A failed preflight changes nothing.
#   3. migration compatibility Read schema_version from the running generation and
#                              from the new binary (GET /version). Newer binary
#                              than schema is a rollback hazard and is called out
#                              before any traffic moves; older binary than schema
#                              aborts the deploy.
#   4. start new instance      Start the new build in one slot. The peer keeps
#                              serving, but see the caveat in deploy/README.md:
#                              startup crash recovery is global, so the peer is
#                              quiesced first unless --allow-peer-traffic is given.
#   5. health                  GET /healthz on the new instance. Liveness only —
#                              it says the process is up, nothing about the ledger.
#   6. readiness               GET /readyz until ready=true. This is the gate: it
#                              fails while the metering queue is full or shutdown
#                              has begun, so it is what decides whether the new
#                              instance may receive traffic at all.
#   7. traffic switch          Put the new instance into the edge's upstream and
#                              take the old one out. An instance that is not ready
#                              never gets traffic — that is the rollback rule
#                              applied before the fact.
#   8. old drain               SIGTERM the old instance and let it exit on its own.
#                              It finalizes its in-flight ledger rows, flushes the
#                              metering queue and only then exits. `docker stop`
#                              with a grace period long enough for that; never a
#                              kill, and never a container removed while draining.
#   9. verify                  Requests through the edge, checked against the
#                              ledger and against the upstream's own counter:
#                              no loss, no duplication.
#  10. cleanup                 Backups pruned to a retention window, the previous
#                              image kept for one rollback, nothing else touched.
#
# Rollback rule:
#   * A new instance that is not healthy AND ready never receives traffic. There
#     is no window in which a broken instance is partially in rotation.
#   * A post-deploy failure — verification fails, or the error rate rises after
#     the switch — reverts the *traffic*: the edge is pointed back at the old
#     instance, which is still running and still consistent. The new instance is
#     stopped, not deleted, so its logs remain for the post-mortem.
#   * An image is never mutated in place. The running container is replaced by a
#     container from a different, digest-addressed image. A deployment that
#     changes the bytes under a running tag is not a deployment this flow can
#     roll back, because there is no earlier state to roll back to.
#
# Immutable: this workflow never moves a tag and never overwrites a release
# asset. Enable "immutable releases" in the repository settings so the guarantee
# is enforced by GitHub rather than by this file's good behaviour.
#
# ---------------------------------------------------------------------------
# Why versioning and publishing are one file, and not two
# ---------------------------------------------------------------------------
#
# Because a GitHub rule forces it, not a preference: an event created with the
# default `GITHUB_TOKEN` does not trigger another workflow run. Release Please
# writes its tag and its GitHub Release with that token, so a `on: push: tags`
# publish workflow would sit there and never fire — the tag exists, nothing
# runs, and the only symptom is a version nobody can install. So publishing is a
# job in this file, gated on Release Please's own output.
#
# The App token the release job uses does technically lift that rule, and the two
# are still not being split on the strength of it: keeping the publish here keeps
# it gated on `release_created` and pinned to the commit this run just tagged,
# which is what makes the artifact traceable to a single run. A tag-triggered
# workflow would be a second entry point, reachable by anything that writes a
# matching tag.
# https://docs.github.com/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow

on:
  push:
    branches: [main]
  # Re-run. Release Please is idempotent — with nothing new to release it writes
  # nothing and the publish jobs are skipped — and a publish that failed is
  # finished with "Re-run failed jobs", which re-runs the same commit the tag
  # names rather than whatever `main` happens to be now.
  workflow_dispatch:

# Never cancel a release in flight. A cancelled publish can leave a tag and a
# GitHub Release written with nothing attached to them, which is the one state
# that needs a human to unpick.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Version and changelog. Merging the Release PR this job maintains is what
  # tags the commit, and `release_created` is what tells every job below that
  # this run is a release rather than an ordinary push to main.
  # ---------------------------------------------------------------------------
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    env:
      # Hoisted so the App-token step has something its `if:` is allowed to
      # read: secrets cannot be referenced in `if:` conditionals, and a direct
      # read takes the job to a startup failure with zero jobs and no log. Only
      # the id is lifted; the private key goes straight into the action's
      # `with:`, where the `secrets` context IS available.
      RELEASE_APP_ID: ${{ secrets.ECOMA_APP_ID }}
    steps:
      - uses: actions/checkout@v7

      # The escape hatch, ON. With the default token the Release PR arrives with
      # no CI attached — it cannot satisfy a required check and sits blocked
      # with nothing red to open. An App token is an ordinary actor, so the pull
      # request it opens triggers CI the way a contributor's does. The
      # credentials are organisation secrets (ECOMA_APP_ID, ECOMA_APP_KEY)
      # shared by every repository running this arrangement; where they are
      # absent the fallback token still maintains the Release PR, and tagging
      # stays available because this workflow runs the publish in the same run.
      - name: Mint a GitHub App token
        id: app-token
        if: env.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ECOMA_APP_ID }}
          private-key: ${{ secrets.ECOMA_APP_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

  # ---------------------------------------------------------------------------
  # The dashboard, built once and handed to every binary job. Building it per
  # architecture would produce four identical bundles and four chances to get
  # one of them wrong.
  # ---------------------------------------------------------------------------
  dashboard:
    name: Dashboard bundle
    needs: [release-please]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      # The release artifact is built from the lockfile, not from whatever
      # resolved at build time: a tag must be reproducible from its own commit.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-dist
          path: dashboard/dist
          retention-days: 3
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Binaries, one native runner per architecture.
  #
  # Native runners rather than `cross` or QEMU. The alternatives were considered
  # and rejected on evidence: QEMU-emulated aarch64 makes a release build of this
  # dependency tree take tens of minutes and cannot run the aarch64 binary, so the
  # artifact would ship untested; `cross` adds a second container toolchain whose
  # behaviour diverges from the runner's exactly where it matters (linker, glibc
  # version). GitHub's arm64 runners are generally available and free for public
  # repositories, so `cargo build` on the target architecture — the same command
  # CI runs for x86_64, with the same linker — is both simpler and more faithful.
  # ---------------------------------------------------------------------------
  binaries:
    name: Binary ${{ matrix.target }}
    needs: [release-please, dashboard]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          # The revision baked into the binary is the commit the tag points at,
          # and a shallow clone cannot prove that is the commit that was checked
          # out.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - uses: actions/download-artifact@v8
        with:
          name: dashboard-dist
          path: dashboard/dist

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          ref="${{ needs.release-please.outputs.tag }}"
          version="${ref#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $ref is not a v-prefixed semver version"
            exit 1
          fi
          echo "tag=$ref" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -euo pipefail
          # Baked in by src/admin/mod.rs via option_env! and served by GET
          # /version: this is how an operator confirms which revision is actually
          # running after a rolling update. The timestamp is computed here rather
          # than read from `github.run_started_at`, which actionlint's context
          # data does not carry.
          export GIT_COMMIT="${{ github.sha }}"
          export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # `--features hyper-rustls` is not optional for a published artifact:
          # without it the connector is plain-HTTP-only, so every real upstream
          # — `config.example.yaml` documents `https://api.openai.com` — is a
          # 502 with no TLS handshake attempted. The feature is opt-in because
          # the `<1s` unit-test loop must not build rustls; every path that
          # *ships* a binary (here and the Dockerfile) opts in explicitly.
          cargo build --locked --release --features hyper-rustls --target "${{ matrix.target }}"

      - name: Package
        id: package
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          target="${{ matrix.target }}"
          name="partner-portal-${version}-${target}"
          mkdir -p "dist/$name"
          cp "target/${target}/release/partner-portal" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          # The version the artifact reports, asserted against the tag it was
          # built from: a mismatch here means the tag and the binary disagree.
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          ( cd dist && sha256sum "$name.tar.gz" >"$name.tar.gz.sha256" )
          echo "name=$name" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.tar.gz
            dist/${{ steps.package.outputs.name }}.tar.gz.sha256
          retention-days: 3
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The OCI image, multi-architecture, pushed by digest.
  # ---------------------------------------------------------------------------
  image:
    name: OCI image
    needs: [release-please, binaries]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # Provenance attestation: the image is signed by the workflow identity, so
      # a deployment can verify it was built here rather than merely pulled from
      # a registry that happened to have it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          ref="${{ needs.release-please.outputs.tag }}"
          echo "tag=$ref" >>"$GITHUB_OUTPUT"
          echo "version=${ref#v}" >>"$GITHUB_OUTPUT"

      - name: Build metadata
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_ENV"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}
            VERSION=${{ steps.version.outputs.version }}
          # No `latest`, and no floating tag of any kind. Every tag this pushes
          # names one immutable build, which is what makes "roll back to the
          # previous digest" a thing an operator can actually do.
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          # Attached attestations, not just tags: provenance (what built it) and
          # the SBOM (what is in it) travel with the digest.
          provenance: true
          sbom: true
          cache-from: type=gha,scope=partner-portal-image
          cache-to: type=gha,mode=max,scope=partner-portal-image

      - name: Record the digest
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}"
          version="${{ steps.version.outputs.version }}"
          digest="${{ steps.build.outputs.digest }}"
          printf '%s@%s\n' "$image" "$digest" >image-digest.txt
          {
            echo "### OCI image"
            echo
            echo '```'
            printf '%s:%s\n' "$image" "$version"
            printf '%s@%s\n' "$image" "$digest"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: image-digest
          path: image-digest.txt
          retention-days: 3
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The release itself: assets, checksums, SBOM, notes.
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [release-please, binaries, image]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # The one job that writes to the repository, and the only thing it writes
      # is the release for the tag it was triggered by.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0

      # The tag must be a tag on the default branch. A release built from a
      # commit that never landed is a release nobody can reproduce from main, and
      # a tag can be pushed to any commit. Release Please tags `main`'s own head,
      # so this is a check on the premise rather than on the output — which is
      # exactly what makes it worth keeping: it fails the release instead of
      # publishing one from a tag nobody can find in the history.
      - name: The tag is an ancestor of main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::tag ${{ needs.release-please.outputs.tag }} does not point at a commit on main"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble the release assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -name '*.tar.gz' -o -name '*.sha256' | xargs -r -I{} cp {} release/
          cp artifacts/image-digest/image-digest.txt release/ 2>/dev/null || true

          # One checksum file over everything that ships, so verification is a
          # single command rather than one per architecture.
          ( cd release && sha256sum -- *.tar.gz >SHA256SUMS )

          echo "assets:"
          ls -l release

      # SBOM of the exact commit the tag names, attached to the release: what a
      # consumer needs to answer "is this build affected by CVE-X" without
      # rebuilding it.
      - name: SBOM (syft, SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: release/sbom.spdx.json
          artifact-name: sbom.spdx.json
          upload-release-assets: false

      # Build provenance for the tarballs, verifiable with `gh attestation verify`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*.tar.gz

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag }}
          name: ${{ needs.release-please.outputs.tag }}
          draft: false
          # A prerelease version string (1.2.3-rc.1) is published as a prerelease
          # rather than as a version clients may pick up by default.
          prerelease: ${{ contains(needs.release-please.outputs.tag, '-') }}
          # No `overwrite_files`: a re-run that finds an asset already present
          # fails instead of replacing it, so an existing release cannot be
          # silently rewritten under a tag that has already been deployed.
          fail_on_unmatched_files: true
          files: |
            release/*.tar.gz
            release/*.sha256
            release/SHA256SUMS
            release/sbom.spdx.json
            release/image-digest.txt
          body: |
            ## Artifacts

            | Artifact | Purpose |
            |---|---|
            | `partner-portal-${{ github.ref_name }}` | release binaries, linux x86_64 and aarch64 |
            | `SHA256SUMS` | checksums for every tarball |
            | `sbom.spdx.json` | dependency SBOM for this commit (SPDX) |
            | `image-digest.txt` | the OCI image, addressed by digest |

            Verify the download before deploying it:

            ```sh
            sha256sum --check SHA256SUMS
            gh attestation verify partner-portal-*.tar.gz --repo ${{ github.repository }}
            ```

            ## Deployment

            Deploy by **digest**, never by tag. The flow — backup, preflight,
            migration compatibility, start new instance, health, readiness, traffic
            switch, old drain, verify, cleanup — and the rollback rule are in
            `.github/workflows/release.yml` and `deploy/README.md`.

            An image is never mutated in place: the previous release keeps its own
            digest, and rolling back means pointing the deployment at the digest it
            was running before.
